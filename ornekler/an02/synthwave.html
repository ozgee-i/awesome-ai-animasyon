<!doctype html>
<!-- AN02 · AI Animasyon Komutu #02 · Stil: Synthwave: mor-pembe gökyüzü, çizgili neon güneş, ufka uzanan neon ızgara zemin, parlayan çizgiler -->
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sahil yolu · Synthwave</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{position:absolute;inset:0;margin:auto;display:block}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=1080,H=1920,T=6,TAU=Math.PI*2;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*s+'px';c.style.height=H*s+'px';}
addEventListener('resize',fit);fit();
const R=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const P=b=>{const p=new Path2D();b(p);return p;};
function off(w,h){const o=document.createElement('canvas');o.width=w;o.height=h;return o;}
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function quant(ctx,w,h,pal,dith){const im=ctx.getImageData(0,0,w,h),d=im.data,PL=pal.map(hex);
 for(let y=0;y<h;y++)for(let i0=0;i0<w;i0++){const i=(y*w+i0)*4;let r=d[i],gg=d[i+1],b=d[i+2];
  if(dith){const tt=(BAYER[(y%4)*4+(i0%4)]/16-0.5)*dith;r+=tt;gg+=tt;b+=tt;}
  let best=0,bd=1e9;for(let k=0;k<PL.length;k++){const dr=r-PL[k][0],dg=gg-PL[k][1],db=b-PL[k][2],dd=dr*dr+dg*dg+db*db;if(dd<bd){bd=dd;best=k;}}
  d[i]=PL[best][0];d[i+1]=PL[best][1];d[i+2]=PL[best][2];d[i+3]=255;}
 ctx.putImageData(im,0,0);}
function state(t){const p=t/T;return {p,far:p*540,lh:p*1080,mid:p*1080,dash:p*1600,near:p*1620,
 bob:Math.sin(TAU*p*6)*4,ang:TAU*p*8,
 gulls:[0,1,2].map(i=>({x:(((R(i)*1280-p*1280*(1+i%2))%1280)+1280)%1280-100,y:300+R(i+9)*300+Math.sin(TAU*(p*2+R(i+3)))*20,f:Math.sin(TAU*(p*6+R(i+5))),s:.9+R(i+7)*.5})),
 boats:[0,1].map(i=>({x:(((R(i+40)*1280-p*1280)%1280)+1280)%1280-100,y:1030+i*80})),
 puffs:[0,1,2,3,4].map(i=>({q:(p*3+i/5)%1}))};}
const CAR={x:500,y:1420};
function car(cx,cy){return {
 body:P(p=>{p.moveTo(cx-170,cy+20);p.lineTo(cx-170,cy-30);p.quadraticCurveTo(cx-165,cy-50,cx-120,cy-55);p.lineTo(cx-80,cy-55);p.quadraticCurveTo(cx-60,cy-130,cx+10,cy-130);p.quadraticCurveTo(cx+70,cy-130,cx+95,cy-55);p.lineTo(cx+150,cy-50);p.quadraticCurveTo(cx+180,cy-45,cx+180,cy-10);p.lineTo(cx+180,cy+20);p.closePath();}),
 glass:P(p=>{p.moveTo(cx-60,cy-60);p.quadraticCurveTo(cx-45,cy-118,cx+5,cy-118);p.lineTo(cx+5,cy-60);p.closePath();p.moveTo(cx+15,cy-60);p.lineTo(cx+15,cy-118);p.quadraticCurveTo(cx+60,cy-116,cx+80,cy-60);p.closePath();}),
 stripe:P(p=>p.rect(cx-170,cy-18,350,10)),
 bump:P(p=>{p.rect(cx-180,cy+8,22,12);p.rect(cx+170,cy+8,22,12);}),
 lamp:{x:cx+172,y:cy-25},
 wheels:[{x:cx-100,y:cy+22},{x:cx+110,y:cy+22}],
 exh:{x:cx-185,y:cy+12}};}
function wheel(g,w,r,ang,c1,c2){g.fillStyle=c1;g.beginPath();g.arc(w.x,w.y,r,0,TAU);g.fill();g.fillStyle=c2;g.beginPath();g.arc(w.x,w.y,r*0.5,0,TAU);g.fill();g.strokeStyle=c1;g.lineWidth=r*0.12;g.beginPath();for(let k=0;k<4;k++){const a=ang+k*TAU/4;g.moveTo(w.x,w.y);g.lineTo(w.x+Math.cos(a)*r*0.5,w.y+Math.sin(a)*r*0.5);}g.stroke();}
function gullP(gx,gy,s,f){return P(p=>{p.moveTo(gx-44*s,gy+6*s);p.quadraticCurveTo(gx-22*s,gy-34*s*f,gx,gy);p.quadraticCurveTo(gx+22*s,gy-34*s*f,gx+44*s,gy+6*s);});}
const BASE={sky:['#2B1B4A','#5B2A6E','#A23B6B','#E0605A','#F59E5B','#FBC97A'],sun:'#FFE29A',hill:'#4B3B6B',sea:'#2E6C8E',sea2:'#7FB9C9',boat:'#F4F1EA',sail:'#FFFFFF',rock:'#3A2F4A',lh:'#F4F1EA',lhR:'#C8402F',lhL:'#FFE29A',shore:'#E9C98B',wire:'#2A2230',pole:'#4A3A2F',palmT:'#6B4A2F',palmL:'#2F6B4A',road:'#3B3B46',edge:'#D8D2C4',line:'#F4E6B8',ground:'#C99E5E',bush:'#4E7A4A',puff:'#EDE6DA',car:'#3E8FB0',car2:'#F4F1EA',glass:'#BFE3EE',light:'#FFE7A0',wheel:'#1E1E24',hub:'#C9CDD4',gull:'#FFFFFF'};
function sahne(g,S,cl,o){o=o||{};const n=cl.sky.length;
 if(o.skyGrad){const gr=g.createLinearGradient(0,0,0,900);cl.sky.forEach((k,i)=>gr.addColorStop(i/(n-1),k));g.fillStyle=gr;g.fillRect(0,0,W,900);}
 else for(let i=0;i<n;i++){g.fillStyle=cl.sky[i];g.fillRect(0,i*900/n,W,900/n+2);}
 g.fillStyle=cl.sun;g.beginPath();g.arc(540,760,170,0,TAU);g.fill();
 g.fillStyle=cl.hill;for(let k=-1;k<4;k++){const ox=k*540-(S.far%540);g.beginPath();g.moveTo(ox,905);g.quadraticCurveTo(ox+130,750,ox+270,860);g.quadraticCurveTo(ox+400,770,ox+540,905);g.closePath();g.fill();}
 g.fillStyle=cl.sea;g.fillRect(0,900,W,284);
 g.strokeStyle=cl.sea2;g.lineWidth=6;for(let r=0;r<4;r++){const y=935+r*62,o2=(S.mid*(r%2?1:0.5))%180;g.beginPath();for(let px=-o2+(r%2)*90-180;px<W;px+=180){g.moveTo(px,y);g.lineTo(px+70,y);}g.stroke();}
 S.boats.forEach(b=>{g.fillStyle=cl.boat;g.beginPath();g.moveTo(b.x-40,b.y);g.lineTo(b.x+40,b.y);g.lineTo(b.x+28,b.y+16);g.lineTo(b.x-28,b.y+16);g.closePath();g.fill();g.fillStyle=cl.sail;g.beginPath();g.moveTo(b.x,b.y-4);g.lineTo(b.x,b.y-80);g.lineTo(b.x+38,b.y-6);g.closePath();g.fill();});
 for(let k=0;k<2;k++){const lx=820-(S.lh%1080)+k*1080;g.fillStyle=cl.rock;g.beginPath();g.ellipse(lx,1184,95,42,0,Math.PI,0);g.fill();g.fillStyle=cl.lh;g.beginPath();g.moveTo(lx-30,1160);g.lineTo(lx-19,985);g.lineTo(lx+19,985);g.lineTo(lx+30,1160);g.closePath();g.fill();g.fillStyle=cl.lhR;g.fillRect(lx-26,1080,52,26);g.fillRect(lx-22,1020,44,22);g.fillStyle=cl.lhL;g.fillRect(lx-22,958,44,27);g.fillStyle=cl.lhR;g.beginPath();g.moveTo(lx-28,958);g.lineTo(lx,925);g.lineTo(lx+28,958);g.closePath();g.fill();}
 g.fillStyle=cl.shore;g.fillRect(0,1182,W,152);
 for(let k=-1;k<5;k++){const ox=k*360-(S.mid%360);
  g.strokeStyle=cl.wire;g.lineWidth=3;g.beginPath();g.moveTo(ox+270,1085);g.quadraticCurveTo(ox+450,1140,ox+630,1085);g.stroke();
  g.fillStyle=cl.pole;g.fillRect(ox+264,1065,12,268);g.fillRect(ox+244,1078,52,9);
  g.strokeStyle=cl.palmT;g.lineWidth=18;g.lineCap='round';g.beginPath();g.moveTo(ox+80,1332);g.quadraticCurveTo(ox+70,1180,ox+112,1062);g.stroke();
  g.fillStyle=cl.palmL;for(let l=0;l<6;l++){const a=-Math.PI/2+(l-2.5)*0.55;g.save();g.translate(ox+112,1062);g.rotate(a);g.beginPath();g.ellipse(48,0,52,13,0.25,0,TAU);g.fill();g.restore();}}
 g.fillStyle=cl.road;g.fillRect(0,1332,W,168);g.fillStyle=cl.edge;g.fillRect(0,1332,W,8);g.fillRect(0,1492,W,8);
 g.fillStyle=cl.line;for(let px=-(S.dash%160);px<W;px+=160)g.fillRect(px,1412,80,10);
 g.fillStyle=cl.ground;g.fillRect(0,1500,W,420);
 g.fillStyle=cl.bush;for(let k=-1;k<6;k++){const bx=k*270-(S.near%270)+60;[[0,0,34],[30,-14,28],[58,2,30]].forEach(([dx,dy,r])=>{g.beginPath();g.arc(bx+dx,1590+dy,r,0,TAU);g.fill();});}
 if(o.araba!==false){const a=car(CAR.x,CAR.y+S.bob);
  S.puffs.forEach(({q})=>{g.globalAlpha=Math.max(0,1-q);g.fillStyle=cl.puff;g.beginPath();g.arc(a.exh.x-q*260,a.exh.y-q*60,12+q*30,0,TAU);g.fill();});g.globalAlpha=1;
  g.fillStyle=cl.car;g.fill(a.body);g.fillStyle=cl.car2;g.fill(a.stripe);g.fill(a.bump);g.fillStyle=cl.glass;g.fill(a.glass);g.fillStyle=cl.light;g.beginPath();g.arc(a.lamp.x,a.lamp.y,10,0,TAU);g.fill();
  a.wheels.forEach(w=>wheel(g,w,40,S.ang,cl.wheel,cl.hub));}
 g.strokeStyle=cl.gull;g.lineWidth=7;g.lineCap='round';S.gulls.forEach(q=>g.stroke(gullP(q.x,q.y,q.s,q.f)));}

function draw(t){const S=state(t),p=S.p;
 const gr=x.createLinearGradient(0,0,0,1000);gr.addColorStop(0,'#0B0221');gr.addColorStop(.55,'#3B0A5A');gr.addColorStop(1,'#C2307F');x.fillStyle=gr;x.fillRect(0,0,W,1000);
 for(let i=0;i<60;i++){const a=0.4+0.6*Math.abs(Math.sin(TAU*(p*2+R(i))));x.fillStyle=`rgba(255,255,255,${a})`;x.fillRect(R(i+10)*W,R(i+20)*600,3,3);}
 x.save();x.beginPath();x.arc(540,820,250,0,TAU);x.clip();const sg=x.createLinearGradient(0,570,0,1070);sg.addColorStop(0,'#FFE66D');sg.addColorStop(.6,'#FF7A59');sg.addColorStop(1,'#FF2E88');x.fillStyle=sg;x.fillRect(290,570,500,500);x.fillStyle='#4A0D63';for(let k=0;k<9;k++){const yy=800+((k*36+p*36)%324),h=3+(yy-800)/324*18;x.fillRect(290,yy,500,h);}x.restore();
 x.lineJoin='round';for(let k=-1;k<4;k++){const ox=k*540-(S.far%540);x.beginPath();x.moveTo(ox,1000);x.lineTo(ox+120,880);x.lineTo(ox+200,940);x.lineTo(ox+320,820);x.lineTo(ox+440,950);x.lineTo(ox+540,1000);x.closePath();x.fillStyle='#14062B';x.fill();x.shadowColor='#2DE2E6';x.shadowBlur=18;x.strokeStyle='#2DE2E6';x.lineWidth=4;x.stroke();x.shadowBlur=0;}
 x.fillStyle='#0B0221';x.fillRect(0,1000,W,920);
 x.shadowColor='#FF2E88';x.shadowBlur=14;x.strokeStyle='#FF2E88';x.lineWidth=3;x.beginPath();
 const fr=(p*6)%1;for(let i=-26;i<=26;i++){const u=i-fr;x.moveTo(540+u*28,1000);x.lineTo(540+u*300,1920);}
 for(let k=0;k<14;k++){const y=1000+920*Math.pow(k/14,2.2);x.moveTo(0,y);x.lineTo(W,y);}
 x.stroke();x.shadowBlur=0;
 for(let k=-1;k<5;k++){const ox=k*360-(S.mid%360)+60;x.strokeStyle='#0B0221';x.lineWidth=16;x.lineCap='round';x.beginPath();x.moveTo(ox,1180);x.quadraticCurveTo(ox-10,1060,ox+30,960);x.stroke();
  x.shadowColor='#FF2E88';x.shadowBlur=16;x.strokeStyle='#FF6EC7';x.lineWidth=3;x.stroke();x.shadowBlur=0;
  for(let l=0;l<6;l++){const a=-Math.PI/2+(l-2.5)*0.55;x.save();x.translate(ox+30,960);x.rotate(a);x.beginPath();x.ellipse(46,0,50,11,0.25,0,TAU);x.fillStyle='#0B0221';x.fill();x.shadowColor='#2DE2E6';x.shadowBlur=12;x.strokeStyle='#2DE2E6';x.lineWidth=2.5;x.stroke();x.shadowBlur=0;x.restore();}}
 const cy=1520+S.bob,a=car(CAR.x,cy);
 S.puffs.forEach(({q})=>{x.globalAlpha=Math.max(0,1-q);x.shadowColor='#FF2E88';x.shadowBlur=14;x.strokeStyle='#FF6EC7';x.lineWidth=4;x.beginPath();x.arc(a.exh.x-q*260,a.exh.y-q*60,12+q*30,0,TAU);x.stroke();});x.globalAlpha=1;x.shadowBlur=0;
 const hb=x.createLinearGradient(a.lamp.x,0,a.lamp.x+360,0);hb.addColorStop(0,'rgba(255,240,180,.55)');hb.addColorStop(1,'rgba(255,240,180,0)');x.fillStyle=hb;x.beginPath();x.moveTo(a.lamp.x,a.lamp.y-6);x.lineTo(a.lamp.x+360,a.lamp.y-60);x.lineTo(a.lamp.x+360,a.lamp.y+50);x.lineTo(a.lamp.x,a.lamp.y+6);x.closePath();x.fill();
 x.fillStyle='#120424';x.fill(a.body);x.shadowColor='#2DE2E6';x.shadowBlur=24;x.strokeStyle='#2DE2E6';x.lineWidth=5;x.stroke(a.body);x.strokeStyle='#FF6EC7';x.lineWidth=3;x.stroke(a.glass);x.shadowBlur=0;x.fillStyle='rgba(45,226,230,.25)';x.fill(a.glass);
 x.shadowColor='#FF2E2E';x.shadowBlur=20;x.fillStyle='#FF3B3B';x.fillRect(CAR.x-178,cy-30,10,18);x.shadowBlur=0;
 a.wheels.forEach(w=>{x.fillStyle='#0B0221';x.beginPath();x.arc(w.x,w.y,40,0,TAU);x.fill();x.shadowColor='#FF2E88';x.shadowBlur=16;x.strokeStyle='#FF6EC7';x.lineWidth=4;x.stroke();x.beginPath();for(let k=0;k<4;k++){const an=S.ang+k*TAU/4;x.moveTo(w.x,w.y);x.lineTo(w.x+Math.cos(an)*30,w.y+Math.sin(an)*30);}x.stroke();x.shadowBlur=0;});
 x.shadowColor='#2DE2E6';x.shadowBlur=10;x.strokeStyle='#2DE2E6';x.lineWidth=5;x.lineCap='round';S.gulls.forEach(q=>x.stroke(gullP(q.x,q.y,q.s,q.f)));x.shadowBlur=0;
 x.fillStyle='rgba(0,0,0,.18)';for(let y=0;y<H;y+=5)x.fillRect(0,y,W,1);}

function loop(ms){draw((ms/1000)%T);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
