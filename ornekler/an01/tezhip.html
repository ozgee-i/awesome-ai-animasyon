<!doctype html>
<!-- AN01 · AI Animasyon Komutu #01 · Stil: Tezhip: lacivert zemin üstünde altın varak, ince kıvrık dallar ve hatai motifleri -->
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boğaz · Tezhip</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{position:absolute;inset:0;margin:auto;display:block}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=1080,H=1920,T=6,TAU=Math.PI*2,HZ=1080;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*s+'px';c.style.height=H*s+'px';}
addEventListener('resize',fit);fit();
const R=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const P=b=>{const p=new Path2D();b(p);return p;};
function city(ox,by,s){return [
 P(p=>p.ellipse(ox+170*s,by,230*s,80*s,0,Math.PI,0)),
 P(p=>{p.rect(ox+110*s,by-120*s,120*s,70*s);p.moveTo(ox+230*s,by-120*s);p.arc(ox+170*s,by-120*s,60*s,0,Math.PI,true);p.closePath();}),
 P(p=>{p.rect(ox+60*s,by-230*s,16*s,190*s);p.moveTo(ox+60*s,by-230*s);p.lineTo(ox+68*s,by-280*s);p.lineTo(ox+76*s,by-230*s);p.closePath();}),
 P(p=>{p.rect(ox+266*s,by-215*s,16*s,175*s);p.moveTo(ox+266*s,by-215*s);p.lineTo(ox+274*s,by-262*s);p.lineTo(ox+282*s,by-215*s);p.closePath();}),
 P(p=>{p.rect(ox+300*s,by-70*s,70*s,40*s);p.moveTo(ox+370*s,by-70*s);p.arc(ox+335*s,by-70*s,35*s,0,Math.PI,true);p.closePath();})
];}
function bridge(cx,dy,s){const L=210*s,th=180*s,E=L*2.2,top=dy-th,yc=dy+th-30*s;
 const cy=u=>(1-u)*(1-u)*top+2*u*(1-u)*yc+u*u*top;
 return {
  towers:P(p=>{p.rect(cx-L-8*s,top,16*s,th+36*s);p.rect(cx+L-8*s,top,16*s,th+36*s);}),
  deck:P(p=>p.rect(cx-E,dy,E*2,12*s)),
  cable:P(p=>{p.moveTo(cx-E,dy);p.quadraticCurveTo(cx-L*1.6,dy-th*0.35,cx-L,top);p.quadraticCurveTo(cx,yc,cx+L,top);p.quadraticCurveTo(cx+L*1.6,dy-th*0.35,cx+E,dy);}),
  hangers:P(p=>{for(let i=1;i<12;i++){const u=i/12,hx=cx-L+2*L*u;p.moveTo(hx,cy(u));p.lineTo(hx,dy);}})
 };}
function ferry(cx,cy,s){return {
 hull:P(p=>{p.moveTo(cx-180*s,cy);p.lineTo(cx+200*s,cy);p.lineTo(cx+160*s,cy+64*s);p.lineTo(cx-150*s,cy+64*s);p.closePath();}),
 cabin:P(p=>{p.rect(cx-120*s,cy-74*s,240*s,74*s);p.rect(cx-80*s,cy-116*s,160*s,42*s);}),
 win:P(p=>{for(let i=0;i<7;i++)p.rect(cx-104*s+i*32*s,cy-56*s,18*s,20*s);}),
 chim:P(p=>p.rect(cx+6*s,cy-190*s,32*s,74*s)),
 top:{x:cx+22*s,y:cy-190*s}
};}
function gull(gx,gy,s,f){return P(p=>{p.moveTo(gx-44*s,gy+6*s);p.quadraticCurveTo(gx-22*s,gy-34*s*f,gx,gy);p.quadraticCurveTo(gx+22*s,gy-34*s*f,gx+44*s,gy+6*s);});}
function state(t){const p=t/T;return {p,
 far:p*340,mid:p*1080,near:p*1620,
 bob:Math.sin(TAU*p*2)*10,
 gulls:[0,1,2,3].map(i=>({x:((R(i)*1280+p*1280*(1+(i%2)))%1280)-100,y:430+R(i+9)*420+Math.sin(TAU*(p*2+R(i+3)))*24,f:Math.sin(TAU*(p*6+R(i+5))),s:.8+R(i+7)*.6})),
 puffs:[0,1,2,3,4].map(i=>({q:(p*2+i/5)%1}))
};}

function rumi(cx,cy,s,a){x.save();x.translate(cx,cy);x.rotate(a);x.beginPath();x.moveTo(0,0);x.bezierCurveTo(20*s,-30*s,50*s,-20*s,44*s,4*s);x.bezierCurveTo(38*s,22*s,18*s,14*s,24*s,0);x.stroke();x.restore();}
function draw(t){const S=state(t),ph=TAU*S.p;
 const gold=x.createLinearGradient(0,0,W,H);gold.addColorStop(0,'#F3D27A');gold.addColorStop(.5,'#C99A2E');gold.addColorStop(1,'#F0CB6B');
 x.fillStyle='#14213D';x.fillRect(0,0,W,H);
 for(let i=0;i<70;i++){const sx=R(i+100)*W,sy=R(i+200)*HZ*0.9,tw=0.5+0.5*Math.sin(TAU*(S.p*2+R(i+300)));x.fillStyle=`rgba(243,210,122,${0.3+0.7*tw})`;x.beginPath();x.arc(sx,sy,2+2*tw,0,TAU);x.fill();}
 x.save();x.translate(780,520);x.rotate(ph/12);for(let k=0;k<12;k++){x.rotate(TAU/12);x.fillStyle=gold;x.beginPath();x.moveTo(0,-60);x.quadraticCurveTo(26,-110,0,-150);x.quadraticCurveTo(-26,-110,0,-60);x.fill();}x.restore();
 x.fillStyle='#B22D2D';x.beginPath();x.arc(780,520,60,0,TAU);x.fill();x.strokeStyle=gold;x.lineWidth=6;x.stroke();x.fillStyle=gold;x.beginPath();x.arc(780,520,22,0,TAU);x.fill();
 for(let k=-1;k<5;k++)city(k*340-S.far,HZ+6,.5).forEach((sh,i)=>{x.fillStyle=i===1||i===4?'#1F4E9E':'#1A2C55';x.fill(sh);x.strokeStyle=gold;x.lineWidth=4;x.stroke(sh);});
 for(let k=0;k<2;k++){const b=bridge(760-S.mid+k*1080,HZ-40,.7);x.fillStyle=gold;x.fill(b.towers);x.fill(b.deck);x.strokeStyle=gold;x.lineWidth=4;x.stroke(b.cable);x.lineWidth=1.5;x.stroke(b.hangers);}
 x.fillStyle='#0F1A33';x.fillRect(0,HZ,W,H-HZ);
 for(let r=0;r<9;r++){const y=HZ+60+r*95,o=(S.p*1080*(r%2?1:2))%180;x.strokeStyle=gold;x.lineWidth=3;x.beginPath();for(let px=-200;px<=W+200;px+=10)x.lineTo(px,y+14*Math.sin((px+o)*TAU/180));x.stroke();for(let px=-180-o;px<W+180;px+=180){rumi(px+45,y-2,1,0);x.fillStyle='#B22D2D';x.beginPath();x.arc(px+135,y+14,4,0,TAU);x.fill();}}
 for(let j=0;j<6;j++){const w=40+30*Math.sin(TAU*(S.p*2+j*.2));x.fillStyle=gold;x.globalAlpha=.85-j*.1;x.fillRect(780-w,HZ+40+j*52,w*2,6);}x.globalAlpha=1;
 const f=ferry(540,1440+S.bob,1.5);x.lineWidth=5;x.strokeStyle=gold;x.fillStyle='#1A2C55';x.fill(f.hull);x.stroke(f.hull);x.fill(f.cabin);x.stroke(f.cabin);x.fillStyle=gold;x.fill(f.win);x.fillStyle='#B22D2D';x.fill(f.chim);x.stroke(f.chim);
 S.puffs.forEach(({q})=>{x.globalAlpha=1-q;x.strokeStyle=gold;x.lineWidth=3;rumi(f.top.x+q*160,f.top.y-q*360,0.8+q,q*2);x.beginPath();x.arc(f.top.x+q*160,f.top.y-q*360,10+q*20,0,TAU);x.stroke();});x.globalAlpha=1;
 x.lineCap='round';S.gulls.forEach(g=>{x.strokeStyle=gold;x.lineWidth=6;x.stroke(gull(g.x,g.y,g.s,g.f));});
 x.strokeStyle=gold;x.lineWidth=8;x.strokeRect(30,30,W-60,H-60);x.lineWidth=3;x.strokeRect(52,52,W-104,H-104);
 for(let k=0;k<12;k++){rumi(80+k*84,41,0.7,0);rumi(80+k*84,H-41,0.7,Math.PI);}
 for(let k=0;k<22;k++){rumi(41,90+k*82,0.7,Math.PI/2);rumi(W-41,90+k*82,0.7,-Math.PI/2);}
 [[41,41],[W-41,41],[41,H-41],[W-41,H-41]].forEach(([a,b])=>{x.fillStyle='#B22D2D';x.beginPath();x.arc(a,b,16,0,TAU);x.fill();x.strokeStyle=gold;x.lineWidth=4;x.stroke();});
}

function loop(ms){draw((ms/1000)%T);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
